function renderGrid(){document.getElementById('lessonGrid').innerHTML=lessons.map(l=>`<div onclick="openLesson('${l.id}')" class="lesson-card cursor-pointer bg-white rounded-[24px] p-5 shadow-sm border-2 border-transparent hover:border-[#2563EB]"><div class="flex justify-between items-start mb-3"><div class="w-12 h-12 ${l.color} rounded-2xl flex items-center justify-center text-2xl text-white shadow">${l.icon}</div><span class="bg-gray-100 text-[10px] font-bold px-2.5 py-1 rounded-full">${l.count} Cards</span></div><h3 class="font-extrabold text-[13px]">${l.name}</h3><p class="text-[11px] text-gray-500 mt-1">${l.desc}</p><p class="mt-3 text-[11px] font-bold text-[#2563EB]">Click → Full Syllabus 🔊</p></div>`).join('');}
function showGrid(){document.getElementById('gridView').classList.remove('hidden');document.getElementById('detailView').classList.add('hidden');document.getElementById('homeBtn').classList.add('hidden');}
function openLesson(id){let ls=lessons.find(x=>x.id===id);document.getElementById('gridView').classList.add('hidden');document.getElementById('detailView').classList.remove('hidden');document.getElementById('homeBtn').classList.remove('hidden');document.getElementById('detailTitle').innerText=ls.icon+' '+ls.name+' - FULL';document.getElementById('detailCount').innerText=ls.count+' Cards • Full Voice';let arr=dataMap[id]||[];let html='';if(id==='ALPHABET'){html=`<div class="grid grid-cols-2 md:grid-cols-4 gap-3">`+arr.map(a=>`<div onmouseenter="speak('${a.full}',this)" onclick="speak('${a.full}',this)" class="card-hover bg-white rounded-[20px] p-5 shadow-sm border-2 hover:border-blue-600 cursor-pointer"><span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-1 rounded-full font-bold">${a.p}</span><h3 class="text-3xl font-extrabold mt-2">${a.l}</h3><p class="text-sm font-bold">${a.w}</p><p class="text-[11px] text-gray-500">${a.m}</p><p class="text-[10px] text-green-700 font-bold mt-1">🔊 ${a.full}</p><button onclick="event.stopPropagation();speak('${a.full}',this.parentElement)" class="mt-2 w-full bg-black text-white py-2 rounded-xl text-xs">🔊 Play Full</button></div>`).join('')+`</div>`;}else if(id==='BLANKS'||id==='BLANKS2'){html=`<div class="grid md:grid-cols-2 gap-3">`+arr.map((b,i)=>`<div class="bg-white rounded-[20px] p-5 shadow border"><div class="flex justify-between"><span class="text-[10px] bg-yellow-100 px-2 py-1 rounded-full font-bold">Übung ${i+1}</span><span class="text-[10px] bg-gray-100 px-2 py-1 rounded-full">${b.hint}</span></div><h3 class="font-bold mt-3 text-[13px]">${b.q}</h3><button onclick="this.nextElementSibling.classList.toggle('hidden');speak('${(b.a||'').replace(/'/g,"")}')" class="mt-3 bg-[#FACC15] px-4 py-2 rounded-xl text-xs font-bold">Show Answer</button><div class="hidden mt-3 bg-green-50 border p-3 rounded-xl"><p class="font-bold text-green-700">✅ ${b.a}</p><p class="text-[11px]">💡 ${b.hint}</p><p class="text-[10px] text-green-700 mt-1">🔊 ${b.full||b.a}</p></div></div>`).join('')+`</div>`;}else{html=`<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">`+arr.map(it=>{let d=it.d||it.l||it.n||it.q||'';let e=it.e||it.p||it.m||it.a||'';let ex=it.ex||it.hint||'';let full=it.full||d||e;return `<div onmouseenter="speak('${full.toString().replace(/'/g,"").substring(0,120)}',this)" onclick="speak('${full.toString().replace(/'/g,"").substring(0,120)}',this)" class="card-hover bg-white rounded-[20px] p-5 shadow-sm border-2 hover:border-blue-600 cursor-pointer"><h3 class="font-extrabold text-[14px]">${d}</h3><p class="text-[12px] font-bold text-blue-600 mt-1">${e}</p><p class="text-[11px] text-gray-600 mt-2 bg-gray-50 p-2 rounded-lg">${ex}</p><p class="text-[10px] text-green-700 font-bold mt-2">🔊 Full: ${full}</p><button onclick="event.stopPropagation();speak('${full.toString().replace(/'/g,"").substring(0,120)}',this.closest('.card-hover'))" class="mt-3 w-full bg-gray-900 text-white py-2 rounded-xl text-xs font-bold">🔊 Play Full German</button></div>`;}).join('')+`</div>`;}document.getElementById('content').innerHTML=html;window.scrollTo(0,0);}
renderGrid();
</script></body></html>
